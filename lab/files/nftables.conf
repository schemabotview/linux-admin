#!/usr/sbin/nft -f
# web-01: drop everything inbound except what the server is for.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        iif lo accept
        meta l4proto { icmp, ipv6-icmp } accept

        tcp dport 22 accept comment "ssh: the team"
        tcp dport { 80, 443 } counter accept comment "the site"

        counter comment "dropped"
    }
}
